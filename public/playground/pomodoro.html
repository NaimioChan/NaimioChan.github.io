<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄钟 · 时钟 · 非茗工坊</title>
<style>
  :root {
    --bg: #e6f0fa;
    --card: #ffffff;
    --accent: #3389d1;
    --accent-soft: #7fb8e8;
    --accent-shadow: rgba(51, 137, 209, 0.32);
    --line: rgba(51, 80, 107, 0.12);
    --line-strong: rgba(51, 80, 107, 0.22);
    --shadow-flat: rgba(51, 80, 107, 0.18);
    --text: #33506b;
    --text-dim: #7d95ad;
    --danger: #d16a5f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "Times New Roman", Times, "Source Han Serif SC", "Noto Serif SC", "思源宋体", "Songti SC", "SimSun", serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    color: var(--text);
    padding: 24px;
  }
  .back {
    position: fixed;
    top: 20px;
    left: 20px;
    font-size: 14px;
    color: var(--text-dim);
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 999px;
    background: var(--card);
    box-shadow: 0 4px 14px -6px var(--shadow-flat);
    transition: color .2s;
    z-index: 10;
  }
  .back:hover { color: var(--accent); }
  h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 4px;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  /* ---------- 时钟 ---------- */
  .clock {
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: var(--card);
    border: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    position: relative;
  }
  .time {
    font-size: 52px;
    font-weight: 300;
    letter-spacing: 3px;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }
  .date {
    font-size: 14px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }
  .clock .ring {
    position: absolute;
    inset: -14px;
    border-radius: 50%;
    pointer-events: none;
    background: conic-gradient(var(--accent) calc(var(--p,0)*1%), transparent 0);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
    opacity: .85;
    transition: --p .3s linear;
  }
  /* ---------- 番茄钟 ---------- */
  .card {
    background: var(--card);
    border-radius: 24px;
    padding: 26px 34px 30px;
    border: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    width: 340px;
    max-width: 92vw;
  }
  .mode-tabs { display: flex; gap: 10px; }
  .mode-tab {
    padding: 8px 16px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    background: var(--card);
    box-shadow: 0 4px 14px -6px var(--shadow-flat);
    cursor: pointer;
    user-select: none;
    transition: all .2s;
    font-family: inherit;
  }
  .mode-tab.active {
    color: #fff;
    background: var(--accent);
    box-shadow: 0 4px 14px -6px var(--shadow-flat);
  }
  .timer {
    font-size: 64px;
    font-weight: 300;
    letter-spacing: 4px;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }
  .timer.work { color: var(--accent); }
  .timer.break { color: #5fae8e; }
  .progress-track {
    width: 100%;
    height: 10px;
    border-radius: 6px;
    background: var(--card);
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 6px;
    background: var(--accent);
    transition: width .3s linear;
  }
  .progress-fill.break { background: #4f9e80; }
  .controls { display: flex; gap: 14px; }
  .btn {
    padding: 10px 22px;
    border: none;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    background: var(--card);
    box-shadow: 0 4px 14px -6px var(--shadow-flat);
    cursor: pointer;
    transition: all .15s;
    font-family: inherit;
  }
  .btn:hover { color: var(--accent); }
  .btn:active {
    transform: scale(0.96);
    color: var(--accent);
  }
  .btn.primary {
    color: #fff;
    background: var(--accent);
  }
  .btn.primary:active { color: #fff; }
  .pomo-count { font-size: 13px; color: var(--text-dim); letter-spacing: 1px; }
  .pomo-count b { color: var(--accent); font-weight: 700; }
  footer { font-size: 12px; color: var(--text-dim); letter-spacing: 1px; }
</style>
</head>
<body>
  <a class="back" href="../index.html">← 返回首页</a>
  <h1>Pomodoro · Clock</h1>

  <div class="clock">
    <div class="ring" id="secRing"></div>
    <div class="time" id="time">00:00:00</div>
    <div class="date" id="date">----年--月--日 周-</div>
  </div>

  <div class="card">
    <div class="mode-tabs">
      <div class="mode-tab active" data-mode="work" id="tabWork">专注 25 分</div>
      <div class="mode-tab" data-mode="break" id="tabBreak">休息 5 分</div>
    </div>
    <div class="timer" id="timer">25:00</div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="controls">
      <button class="btn primary" id="btnToggle">开始</button>
      <button class="btn" id="btnReset">重置</button>
    </div>
    <div class="pomo-count">今日已完成 <b id="pomoCount">0</b> 个番茄</div>
  </div>

  <footer>水蓝扁平 · 纯 HTML/CSS/JS 单文件 · 番茄计数自动保存</footer>

<script>
(function () {
  "use strict";

  /* ---------- 时钟 ---------- */
  var timeEl = document.getElementById("time");
  var dateEl = document.getElementById("date");
  var secRing = document.getElementById("secRing");
  var WEEK = ["日", "一", "二", "三", "四", "五", "六"];

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function tick() {
    var d = new Date();
    var h = pad(d.getHours()), m = pad(d.getMinutes()), s = pad(d.getSeconds());
    timeEl.textContent = h + ":" + m + ":" + s;
    dateEl.textContent = d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日 周" + WEEK[d.getDay()];
    secRing.style.setProperty("--p", (d.getSeconds() / 60) * 100);
  }
  tick();
  setInterval(tick, 200);

  /* ---------- 番茄钟（今日计数持久化） ---------- */
  var WORK = 25 * 60, BREAK = 5 * 60;
  var state = { mode: "work", remain: WORK, total: WORK, running: false, pomos: 0 };
  var timerEl = document.getElementById("timer");
  var fillEl = document.getElementById("progressFill");
  var btnToggle = document.getElementById("btnToggle");
  var tabWork = document.getElementById("tabWork");
  var tabBreak = document.getElementById("tabBreak");
  var pomoCountEl = document.getElementById("pomoCount");
  var intervalId = null;

  // 今日番茄：localStorage 按日期存储，跨刷新保留
  function loadPomos() {
    var today = new Date().toDateString();
    try {
      var saved = JSON.parse(localStorage.getItem("pomo-today") || "{}");
      if (saved.date === today) return saved.count | 0;
    } catch (e) {}
    return 0;
  }
  function savePomos() {
    try {
      localStorage.setItem("pomo-today", JSON.stringify({ date: new Date().toDateString(), count: state.pomos }));
    } catch (e) {}
  }
  state.pomos = loadPomos();

  function fmt(sec) {
    var mm = Math.floor(sec / 60), ss = sec % 60;
    return pad(mm) + ":" + pad(ss);
  }

  function render() {
    timerEl.textContent = fmt(state.remain);
    timerEl.className = "timer " + (state.mode === "work" ? "work" : "break");
    var pct = state.total > 0 ? ((state.total - state.remain) / state.total) * 100 : 0;
    fillEl.style.width = pct + "%";
    fillEl.className = "progress-fill " + (state.mode === "work" ? "" : "break");
    btnToggle.textContent = state.running ? "暂停" : "开始";
    tabWork.classList.toggle("active", state.mode === "work");
    tabBreak.classList.toggle("active", state.mode === "break");
    pomoCountEl.textContent = state.pomos;
  }

  function switchMode(mode) {
    stop();
    state.mode = mode;
    state.total = state.remain = (mode === "work" ? WORK : BREAK);
    render();
  }

  function start() {
    if (state.running) return;
    state.running = true;
    intervalId = setInterval(function () {
      state.remain--;
      if (state.remain <= 0) {
        state.remain = 0;
        stop();
        if (state.mode === "work") {
          state.pomos++;
          savePomos();
          switchMode("break");
          start();
        } else {
          switchMode("work");
        }
      }
      render();
    }, 1000);
    render();
  }

  function stop() {
    state.running = false;
    if (intervalId) { clearInterval(intervalId); intervalId = null; }
    render();
  }

  function reset() {
    stop();
    state.total = state.remain = (state.mode === "work" ? WORK : BREAK);
    render();
  }

  btnToggle.addEventListener("click", function () {
    if (state.running) stop(); else start();
  });
  btnReset.addEventListener("click", reset);
  tabWork.addEventListener("click", function () { switchMode("work"); });
  tabBreak.addEventListener("click", function () { switchMode("break"); });

  render();
})();
</script>
</body>
</html>
