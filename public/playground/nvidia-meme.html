<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英伟达董事会调查发现 · 梗图生成器</title>
<style>
  :root{
    --bg:#16161e; --panel:#1f2335; --card:#1a1b26;
    --line:#292e42;
    --fg:#c0caf5; --fg-dim:#a9b1d6; --muted:#565f89;
    --accent:#7dcfff;
    --news-ink:#111111; --news-dim:#555555;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:ui-monospace,"JetBrains Mono","Cascadia Mono","SFMono-Regular",Consolas,"Courier New",monospace;
    background:var(--bg); color:var(--fg);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    gap:16px; padding:28px 16px 48px;
  }
  .back{
    align-self:flex-start; font-size:14px; color:var(--muted); text-decoration:none;
    padding:8px 16px; border-radius:8px; background:var(--panel);
    border:1px solid var(--line); transition:color .2s;
  }
  .back:hover{color:var(--accent);}
  h1{font-size:22px; font-weight:600; letter-spacing:1px; color:var(--fg); text-align:center;}
  h1::before{content:"$ "; color:var(--accent);}
  .sub{font-size:13px; color:var(--muted); margin-top:-8px; text-align:center;}

  .layout{display:flex; gap:22px; align-items:flex-start; flex-wrap:wrap; justify-content:center; max-width:1160px;}
  .panel{background:var(--panel); border-radius:14px; padding:20px 22px; border:1px solid var(--line);}
  .editor{width:420px; display:flex; flex-direction:column; gap:13px;}
  .preview-panel{padding:14px;}

  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:12px; color:var(--muted);}
  .field input, .field textarea, .field select{
    font-family:inherit; font-size:14px; color:var(--fg);
    background:var(--card); border:1px solid var(--line); border-radius:8px;
    padding:9px 12px; outline:none; resize:vertical; transition:border-color .15s;
  }
  .field input:focus, .field textarea:focus{border-color:var(--accent);}
  textarea{min-height:58px; line-height:1.5;}
  input[type="file"]{font-size:12px;}
  input[type="range"]{accent-color:var(--accent); padding:4px 0;}

  .btnrow{display:flex; gap:8px; flex-wrap:wrap;}
  button{
    font-family:inherit; font-size:13px; cursor:pointer;
    padding:9px 14px; border-radius:8px; color:var(--fg-dim);
    background:var(--card); border:1px solid var(--line);
    transition:color .12s, border-color .12s;
  }
  button:hover{color:var(--accent); border-color:var(--accent);}
  button.primary{background:var(--accent); color:#16161e; border-color:var(--accent); font-weight:600;}
  button.primary:hover{filter:brightness(1.1); color:#16161e;}

  .tips{font-size:12px; color:var(--muted); line-height:1.8;}
  .tips b{color:var(--accent); font-weight:600;}

  /* ── 预览：直接渲染导出用的同一张 canvas，所见即所得 ── */
  #preview{background:#fff; width:560px; max-width:88vw; height:auto; display:block;
    border-radius:4px; box-shadow:0 8px 30px -10px rgba(0,0,0,.5);}

  .toast{position:fixed; left:50%; bottom:32px; transform:translateX(-50%) translateY(20px);
    background:var(--accent); color:#16161e; font-size:13px;
    padding:10px 20px; border-radius:8px; opacity:0; pointer-events:none; transition:.25s; z-index:9;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (max-width:1020px){ .editor{width:min(560px,92vw);} }
</style>
</head>
<body>
<a class="back" href="../">← cd ../</a>
<h1>英伟达董事会调查发现</h1>
<p class="sub">梗图生成器 · 预览即成品 · 一本正经地胡说八道</p>

<div class="layout">
  <div class="panel editor">
    <div class="field">
      <label>媒体名（左上角署名）</label>
      <input id="src" value="arknights">
    </div>
    <div class="field">
      <label>大标题</label>
      <textarea id="headline">英伟达董事会调查发现，CEO黄仁勋玩绝区零只抽萝莉角色</textarea>
    </div>
    <div class="field">
      <label>引语</label>
      <textarea id="quote">我们发现了黄仁勋的绝区零账号，让我们震惊的是，他在这款二次元动作游戏中，坚持只抽取体型娇小可爱的女角色</textarea>
    </div>
    <div class="field">
      <label>引语署名</label>
      <input id="attr" value="一位明显受惊的英伟达高管说。">
    </div>
    <div class="field">
      <label>日期</label>
      <input id="date" value="November 17, 2028">
    </div>
    <div class="field">
      <label>左图（默认皮衣照，可替换）</label>
      <input type="file" id="imgL" accept="image/*">
    </div>
    <div class="field">
      <label>右图（游戏截图/梗图，可选）</label>
      <input type="file" id="imgR" accept="image/*">
    </div>
    <div class="field">
      <label>模糊度：<span id="blurVal">0</span>（赛博文物化 · 高斯模糊）</label>
      <input type="range" id="blur" min="0" max="8" step="1" value="0">
    </div>
    <div class="field">
      <label>转发次数：<span id="fwdVal">0</span>（赛博文物化 · JPEG 压损）</label>
      <input type="range" id="fwd" min="0" max="6" step="1" value="0">
    </div>
    <div class="field">
      <label>输出分辨率</label>
      <select id="res">
        <option value="1120" selected>1120 px（原版）</option>
        <option value="800">800 px（缩水版）</option>
        <option value="560">560 px（祖传压缩包版）</option>
        <option value="360">360 px（QQ 群连环转发版）</option>
      </select>
    </div>
    <div class="btnrow">
      <button id="random">随机来一条</button>
      <button id="download" class="primary">下载图片</button>
    </div>
    <p class="tips">
      句式公式：<b>英伟达董事会最新内部调查发现，前 CEO 黄仁勋在任期间，曾多次【一件微不足道但很欠扁的小事】。</b><br>
      日期建议填一个未来年份，虚构感拉满。「模糊度」和「转发次数」只影响下载的成品，预览始终是干净原图。图片仅在本地处理，不会上传。
    </p>
  </div>

  <div class="panel preview-panel">
    <canvas id="preview" width="1120" height="1200"></canvas>
  </div>
</div>

<canvas id="export" style="display:none;"></canvas>
<div class="toast" id="toast"></div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var SANS = '"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",sans-serif';

  var placeholder = function(text){
    var c = document.createElement('canvas'); c.width = 800; c.height = 600;
    var g = c.getContext('2d');
    g.fillStyle = '#ececec'; g.fillRect(0,0,800,600);
    g.fillStyle = '#bbbbbb'; g.font = '34px ' + SANS;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(text, 400, 300);
    return c.toDataURL();
  };
  var PH_L = placeholder('配图一（点击替换）');
  var PH_R = placeholder('配图二（点击上传）');

  // 图片源：预览与导出共用同一对 Image 对象
  var imgL = new Image(), imgR = new Image();
  var jensenReady = false, rightReady = false;
  function refresh(){ renderPreview(); }
  imgL.onload = function(){ jensenReady = true; refresh(); };
  imgL.onerror = function(){ imgL.src = PH_L; };
  imgL.src = 'jensen.png';
  imgR.onload = function(){ rightReady = true; refresh(); };
  imgR.src = PH_R;

  var presets = [
    {h:'英伟达董事会调查发现，CEO黄仁勋曾用公司微波炉加热开了盖的鲑鱼，导致茶水间一个星期才散掉臭味。',
     q:'微波炉内部的清洁工作目前仍在进行中，我们建议全体员工暂时改用冷水午餐。',
     a:'一位不愿透露姓名的茶水间清洁主管说。'},
    {h:'英伟达董事会调查发现，前CEO黄仁勋玩卫戍协议经常速本漏怪，还发问号表情给没能兜住的队友。',
     q:'他的补刀数据令人担忧，但他对队友发出的问号更令人担忧。',
     a:'一位已经卸载游戏的副本队长说。'},
    {h:'英伟达董事会调查发现，前CEO黄仁勋曾多次在周五下午5点59分在群里发"大家周末有空吗？简单开个小会"。',
     q:'会议确实很简单，只开了一个周末。',
     a:'一位明显憔悴的英伟达员工说。'},
    {h:'英伟达董事会调查发现，前CEO黄仁勋曾多次在推出新显卡前，亲自把旧款显卡的驱动调慢5%。',
     q:'我们不做制造需求的事情，我们只做需求的搬运工。',
     a:'一位刚刚更新完驱动的英伟达工程师说。'},
    {h:'英伟达董事会调查发现，前CEO黄仁勋玩排位赛时经常秒锁输出位，并在开局3分钟送出首杀后直接断线。',
     q:'网络波动是每个人的责任，但显然主要是网络的责任。',
     a:'一位明显血压升高的野区选手说。'},
    {h:'英伟达董事会调查发现，CEO黄仁勋的退款申请理由全部填写为"商品与我想象中的不一样"，共计三十七次。',
     q:'想象力是一种稀缺资源，他只是用得比谁都频繁。',
     a:'一位已经麻了的客服主管说。'},
    {h:'英伟达董事会调查发现，前CEO黄仁勋在健身房办的卡从未使用过，但每年续费时都坚称"下个月就开始"。',
     q:'下个月是一个无限递归的时间概念。',
     a:'一位明显看开了的健身房前台说。'},
    {h:'英伟达董事会调查发现，前CEO黄仁勋曾多次把显卡发布会的PPT留到彩排前一晚才做，并在凌晨3点给设计师发"在吗"。',
     q:'在吗两个字，是当代职场最恐怖的恐怖片。',
     a:'一位明显失眠的设计师说。'},
    {h:'英伟达董事会调查发现，CEO黄仁勋玩绝区零只抽萝莉角色。',
     q:'我们发现了黄仁勋的绝区零账号，让我们震惊的是，他在这款二次元动作游戏中，坚持只抽取体型娇小可爱的女角色。',
     a:'一位明显受惊的英伟达高管说。'},
    {h:'英伟达董事会调查发现，前CEO黄仁勋多次在食堂插队，理由是"我赶时间拯救算力行业"。',
     q:'算力行业确实被拯救了，但那天他没吃到红烧肉。',
     a:'一位明显饿着肚子的排队员工说。'}
  ];

  // ── 文字排版（预览与导出共用）──
  function wrapText(g, text, x, y, maxW, lineH, indent){
    var first = true, line = '', w = 0;
    for(var i = 0; i < text.length; i++){
      var ch = text[i];
      var cw = g.measureText(ch).width;
      if(w + cw > maxW && line){
        g.fillText(line, first && indent ? x + 28 : x, y);
        y += lineH; line = ch; w = cw; first = false;
      } else { line += ch; w += cw; }
    }
    if(line) g.fillText(line, first && indent ? x + 28 : x, y);
    return y + lineH;
  }

  // ── 组装新闻卡 canvas（基础尺寸 1120，scale = 输出/1120）──
  function buildCard(scale){
    var W = Math.round(1120 * scale), PAD = Math.round(76 * scale), GAP = Math.round(20 * scale);
    var src = $('src').value.trim() || 'arknights';
    var headline = $('headline').value.trim();
    var quote = '“' + $('quote').value.trim() + '”';
    var attr = $('attr').value.trim();
    var date = $('date').value.trim();
    var innerW = W - PAD*2, colW = (innerW - GAP)/2;
    var s = scale;

    var c = document.createElement('canvas');
    c.width = W; c.height = Math.round(2200 * s);
    var g = c.getContext('2d');
    g.fillStyle = '#ffffff'; g.fillRect(0,0,W,c.height);
    var y = PAD;

    g.fillStyle = '#555555'; g.font = Math.round(26*s) + 'px ' + SANS;
    g.fillText(src, PAD, y + Math.round(26*s)); y += Math.round(58*s);

    g.fillStyle = '#111111';
    g.font = '700 ' + Math.round(60*s) + 'px ' + SANS;
    y = wrapText(g, headline, PAD, y + Math.round(60*s), innerW, Math.round(84*s), false);
    y += Math.round(36*s);

    g.fillStyle = '#222222'; g.font = Math.round(32*s) + 'px ' + SANS;
    y = wrapText(g, quote, PAD, y + Math.round(32*s), innerW, Math.round(54*s), true);
    y += Math.round(6*s);
    g.fillStyle = '#555555'; g.font = Math.round(28*s) + 'px ' + SANS;
    g.fillText(attr, PAD + Math.round(56*s), y + Math.round(8*s));
    y += Math.round(74*s);

    // 两图按各自比例取高，行高取较大者；contain 完整显示，无裁切
    function ratioOf(img){
      var iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
      return (iw && ih) ? ih/iw : 0.75;
    }
    var imgH = Math.max(ratioOf(imgL), ratioOf(imgR)) * colW;
    function drawContain(img, x){
      var iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
      if(!iw || !ih){ g.fillStyle = '#ececec'; g.fillRect(x, y, colW, imgH); return; }
      var r = Math.min(colW/iw, imgH/ih), dw = iw*r, dh = ih*r;
      g.drawImage(img, x + (colW-dw)/2, y + (imgH-dh)/2, dw, dh);
    }
    drawContain(imgL, PAD);
    drawContain(imgR, PAD + colW + GAP);
    y += imgH + Math.round(44*s);

    g.fillStyle = '#555555'; g.font = Math.round(24*s) + 'px ' + SANS;
    g.fillText(date, PAD, y);

    var H = Math.ceil(y + PAD*0.4);
    var out = document.createElement('canvas'); out.width = W; out.height = H;
    out.getContext('2d').drawImage(c, 0, 0);
    return out;
  }

  // ── 预览：把同一张卡缩放画到 #preview 上（与导出像素级一致）──
  function renderPreview(){
    var card = buildCard(1);
    var pv = $('preview');
    pv.width = card.width; pv.height = card.height;
    var g = pv.getContext('2d');
    g.clearRect(0,0,pv.width,pv.height);
    g.drawImage(card, 0, 0);
  }

  // ── 赛博文物化：模糊 + 反复 JPEG 压损（缩小→放回循环）──
  function degrade(card){
    var blurPx = parseInt($('blur').value, 10);
    var fwd = parseInt($('fwd').value, 10);
    var out = card;
    if(blurPx > 0){
      var c = document.createElement('canvas'); c.width = card.width; c.height = card.height;
      var g = c.getContext('2d');
      g.filter = 'blur(' + (blurPx * card.width / 1120) + 'px)';
      g.drawImage(card, 0, 0);
      g.filter = 'none';
      out = c;
    }
    for(var i = 0; i < fwd; i++){
      var small = document.createElement('canvas');
      small.width = Math.max(1, Math.round(out.width * 0.72));
      small.height = Math.max(1, Math.round(out.height * 0.72));
      small.getContext('2d').drawImage(out, 0, 0, small.width, small.height);
      var back = document.createElement('canvas'); back.width = out.width; back.height = out.height;
      back.getContext('2d').drawImage(small, 0, 0, back.width, back.height);
      out = back;
    }
    return out;
  }

  function download(){
    var scale = parseInt($('res').value, 10) / 1120;
    var card = buildCard(scale);
    var final = degrade(card);
    var fwd = parseInt($('fwd').value, 10);
    var quality = fwd >= 5 ? 0.4 : fwd >= 3 ? 0.5 : fwd >= 1 ? 0.6 : 0.92;
    var type = fwd > 0 ? 'image/jpeg' : 'image/png';
    final.toBlob(function(blob){
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = fwd > 0 ? 'nvidia-board-investigation.jpg' : 'nvidia-board-investigation.png';
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
      toast('已生成，正在下载 (´▽`)');
    }, type, quality);
  }

  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }

  function loadImageFile(file, img, ph){
    if(!file){ img.src = ph; return; }
    var rd = new FileReader();
    rd.onload = function(){ img.src = rd.result; };  // onload 后统一 renderPreview
    rd.readAsDataURL(file);
  }

  ['src','headline','quote','attr','date'].forEach(function(id){
    $(id).addEventListener('input', renderPreview);
  });
  $('imgL').addEventListener('change', function(e){ loadImageFile(e.target.files[0], imgL, PH_L); });
  $('imgR').addEventListener('change', function(e){ loadImageFile(e.target.files[0], imgR, PH_R); });
  $('random').addEventListener('click', function(){
    var p = presets[Math.floor(Math.random()*presets.length)];
    $('headline').value = p.h; $('quote').value = p.q; $('attr').value = p.a;
    renderPreview();
  });
  $('download').addEventListener('click', download);
  renderPreview();
})();
</script>
</body>
</html>
