<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水蓝声波 · 音乐频谱可视化</title>
<style>
  :root{
    --bg:#e6f0fa; --surface:#dbe7f3;
    --shadow-dk:#b9c9d9; --shadow-lt:#ffffff;
    --accent:#3389d1; --accent-soft:#7fb8e8;
    --text:#33506b; --text-dim:#7d95ad;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:"Times New Roman",Times,"Source Han Serif SC","Noto Serif SC","思源宋体","Songti SC","SimSun",serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .card{
    background:var(--surface);border-radius:26px;padding:24px 28px;width:900px;
    box-shadow:8px 8px 20px var(--shadow-dk), -8px -8px 20px var(--shadow-lt);
  }
  h1{font-size:20px;letter-spacing:4px;color:var(--accent);margin-bottom:2px;}
  .sub{font-size:12px;color:var(--text-dim);letter-spacing:1px;margin-bottom:14px;}
  canvas#viz{
    display:block;width:100%;height:340px;border-radius:18px;background:linear-gradient(180deg,#f2f7fc,#e3edf7);
    box-shadow:inset 4px 4px 12px var(--shadow-dk), inset -4px -4px 12px var(--shadow-lt);
  }
  .row{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap;}
  .btn{
    padding:8px 18px;border:none;border-radius:14px;background:var(--surface);color:var(--text-dim);
    font-size:13px;font-weight:700;letter-spacing:1px;cursor:pointer;font-family:inherit;
    box-shadow:5px 5px 10px var(--shadow-dk), -5px -5px 10px var(--shadow-lt);
    transition:color .15s, box-shadow .15s;
  }
  .btn:hover{color:var(--accent);}
  .btn.on{color:var(--accent);box-shadow:inset 3px 3px 8px var(--shadow-dk), inset -3px -3px 8px var(--shadow-lt);}
  .btn.primary{color:#fff;background:linear-gradient(145deg,var(--accent),var(--accent-soft));
    box-shadow:4px 4px 10px rgba(51,137,209,.35), -4px -4px 10px rgba(255,255,255,.6);}
  .btn.primary:active{transform:translateY(1px);}
  .grp{display:flex;gap:6px;align-items:center;}
  .lbl{font-size:11px;color:var(--text-dim);letter-spacing:2px;margin-right:2px;}
  input[type=range]{-webkit-appearance:none;width:120px;height:6px;border-radius:3px;background:var(--bg);
    box-shadow:inset 2px 2px 5px var(--shadow-dk), inset -2px -2px 5px var(--shadow-lt);outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:linear-gradient(145deg,var(--accent-soft),var(--accent));box-shadow:0 0 10px rgba(51,137,209,.5);cursor:pointer;}
  #songName{font-size:13px;color:var(--text);margin-left:auto;letter-spacing:1px;}
  #songName small{color:var(--text-dim);}
  /* 播放进度条 */
  .seek-row{display:flex;align-items:center;gap:10px;margin-top:14px;}
  #seekBar{-webkit-appearance:none;flex:1;height:6px;border-radius:3px;background:var(--bg);
    box-shadow:inset 2px 2px 5px var(--shadow-dk), inset -2px -2px 5px var(--shadow-lt);outline:none;cursor:pointer;}
  #seekBar::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:linear-gradient(145deg,var(--accent-soft),var(--accent));box-shadow:0 0 10px rgba(51,137,209,.5);cursor:pointer;}
  .seek-time{font-size:12px;color:var(--text-dim);font-variant-numeric:tabular-nums;letter-spacing:1px;min-width:40px;text-align:center;}
  #dropHint{font-size:12px;color:var(--text-dim);letter-spacing:1px;margin-top:10px;text-align:center;
    border:1px dashed rgba(51,137,209,.4);border-radius:12px;padding:8px;cursor:pointer;background:var(--bg);
    box-shadow:inset 2px 2px 5px var(--shadow-dk), inset -2px -2px 5px var(--shadow-lt);}
  #dropHint:hover{border-color:var(--accent);color:var(--accent);}
  .freq-tag{font-size:11px;color:var(--text-dim);letter-spacing:1px;}
  /* 导出面板 */
  .export-box{
    margin-top:16px;border-radius:16px;background:var(--bg);
    padding:14px 18px;
    box-shadow:inset 4px 4px 10px var(--shadow-dk), inset -4px -4px 10px var(--shadow-lt);
  }
  .export-box h2{font-size:14px;color:var(--accent);letter-spacing:3px;margin-bottom:10px;}
  .export-grid{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
  .exp-item{display:flex;flex-direction:column;gap:4px;}
  .exp-item .lbl{font-size:11px;color:var(--text-dim);letter-spacing:2px;}
  .exp-item input[type=number]{width:72px;padding:6px 8px;border:none;border-radius:10px;
    background:var(--surface);color:var(--text);font-size:13px;text-align:center;
    box-shadow:inset 2px 2px 5px var(--shadow-dk), inset -2px -2px 5px var(--shadow-lt);outline:none;font-family:inherit;}
  .exp-item select{padding:6px 8px;border:none;border-radius:10px;background:var(--surface);color:var(--text);
    font-size:13px;box-shadow:inset 2px 2px 5px var(--shadow-dk), inset -2px -2px 5px var(--shadow-lt);outline:none;font-family:inherit;}
  .exp-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center;}
  #expProgress{font-size:12px;color:var(--accent);letter-spacing:1px;min-height:16px;}
</style>
</head>
<body>
<a class="back" href="../index.html" style="position:absolute;top:16px;left:16px;font-size:13px;color:var(--muted);text-decoration:none;letter-spacing:1px;z-index:9;">← 返回首页</a>
<div class="card">
  <h1>水蓝声波</h1>
  <div class="sub">AQUA WAVEFORM · Web Audio 频谱可视化（导入本地音频）</div>
  <canvas id="viz" width="900" height="340"></canvas>
  <div class="seek-row">
    <span class="seek-time" id="timeNow">0:00</span>
    <input type="range" id="seekBar" min="0" max="1000" value="0">
    <span class="seek-time" id="timeTotal">0:00</span>
  </div>
  <div class="row">
    <button class="btn primary" id="btnPlay">▶ 播放</button>
    <div class="grp"><span class="lbl">模式</span>
      <button class="btn on" data-mode="bars">频谱条</button>
      <button class="btn" data-mode="line">频谱线</button>
      <button class="btn" data-mode="wave">波形</button>
      <button class="btn" data-mode="radial">圆环</button>
    </div>
    <div class="grp"><span class="lbl">倍速</span>
      <button class="btn on" data-rate="1">1.0x</button>
      <button class="btn" data-rate="0.5">0.5x</button>
      <button class="btn" data-rate="1.5">1.5x</button>
      <button class="btn" data-rate="2">2.0x</button>
    </div>
    <div class="grp"><span class="lbl">音量</span><input type="range" id="vol" min="0" max="100" value="70"></div>
    <span id="songName">未加载音频 <small>(拖入文件或点击下方导入)</small></span>
  </div>
  <div id="dropHint">🎵 拖入本地音频文件（mp3 / wav / ogg / m4a）替换音源</div>

  <!-- 导出面板 -->
  <div class="export-box">
    <h2>导出</h2>
    <div class="export-grid">
      <div class="exp-item"><span class="lbl">模式</span>
        <select id="expMode">
          <option value="bars">频谱条</option>
          <option value="line">频谱线</option>
          <option value="wave">波形</option>
          <option value="radial">圆环</option>
        </select>
      </div>
      <div class="exp-item"><span class="lbl">宽度 px</span>
        <input type="number" id="expW" min="160" max="1920" step="16" value="960">
      </div>
      <div class="exp-item"><span class="lbl">高度 px</span>
        <input type="number" id="expH" min="90" max="1080" step="16" value="540">
      </div>
      <div class="exp-item"><span class="lbl">帧率 fps</span>
        <select id="expFps">
          <option value="12">12</option>
          <option value="24" selected>24</option>
          <option value="30">30</option>
          <option value="60">60</option>
        </select>
      </div>
    </div>
    <div class="exp-actions">
      <button class="btn" id="btnExpPng">导出透明 PNG 序列 (ZIP)</button>
      <button class="btn" id="btnExpVid">导出视频 (MP4/WebM 带原曲)</button>
      <span id="expProgress"></span>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============ 工具 ============ */
const $ = id => document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);

/* ============ 音频图 ============ */
let AC=null, analyser=null, master=null, source=null;
let playing=false, mode='bars', rateVal=1;

function initAudio(){
  if(AC) return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  analyser=AC.createAnalyser();
  analyser.fftSize=2048;
  analyser.smoothingTimeConstant=0.82;
  master=AC.createGain();
  master.gain.value=$('vol').value/100;
  analyser.connect(master);
  master.connect(AC.destination);
}

/* ============ 播放控制（播放器式：可拖动进度条 / 暂停续播） ============ */
let currentBuf=null, bufLabel='', pauseOffset=0, startAt=0, ctxStart=0, seeking=false;

function stopSrc(){
  if(source){ try{source.onended=null;source.stop();}catch(e){} source=null; }
}
function fmtTime(s){
  if(!isFinite(s)||s<0) s=0;
  const m=Math.floor(s/60), ss=Math.floor(s%60);
  return m+':'+String(ss).padStart(2,'0');
}
function curTime(){
  if(!source||!playing) return pauseOffset;
  return clamp(startAt+(AC.currentTime-ctxStart)*source.playbackRate.value, 0, currentBuf?currentBuf.duration:0);
}
function updatePlayUI(){
  $('btnPlay').textContent=playing?'⏸ 暂停':'▶ 播放';
}
function playBuffer(buf,label,offset){
  initAudio();
  stopSrc();
  AC.resume();
  currentBuf=buf; // 播放入口统一持有音源（导入/续播/seek 都走这里）
  if(label!==undefined) bufLabel=label;
  source=AC.createBufferSource();
  source.buffer=buf;
  source.loop=false; // 播放器语义：播完即停，不循环
  source.playbackRate.value=rateVal;
  source.connect(analyser);
  const off=clamp(offset,0,Math.max(0,buf.duration-0.05));
  startAt=off; ctxStart=AC.currentTime;
  source.onended=()=>{
    if(playing){ // 自然播完（手动 stop 前已置 onended=null，不会走到这）
      playing=false; pauseOffset=buf.duration;
      updatePlayUI();
      $('seekBar').value=1000;
      $('timeNow').textContent=fmtTime(pauseOffset);
    }
  };
  source.start(0,off);
  playing=true;
  updatePlayUI();
  $('songName').innerHTML=label;
}
function togglePlay(){
  if(!currentBuf){ alert('请先导入音频文件'); $('dropHint').style.borderColor='rgba(110,195,240,.8)'; return; }
  if(playing){
    pauseOffset=curTime();
    stopSrc();
    playing=false;
    updatePlayUI();
  } else {
    // 已播完则从头播，否则从暂停处继续
    const resumeFrom = pauseOffset >= currentBuf.duration-0.05 ? 0 : pauseOffset;
    playBuffer(currentBuf,bufLabel,resumeFrom);
  }
}
function seekTo(t){
  if(!currentBuf) return;
  const tt=clamp(t,0,currentBuf.duration);
  if(playing){
    playBuffer(currentBuf,bufLabel,tt); // 重播 source 并从 tt 继续
  } else {
    pauseOffset=tt;
    $('timeNow').textContent=fmtTime(tt);
  }
}
$('seekBar').addEventListener('input',()=>{
  seeking=true;
  if(currentBuf) $('timeNow').textContent=fmtTime(+$('seekBar').value/1000*currentBuf.duration);
});
$('seekBar').addEventListener('change',()=>{
  seeking=false;
  if(currentBuf){
    seekTo(+$('seekBar').value/1000*currentBuf.duration);
    if(!playing) $('seekBar').value=Math.round(pauseOffset/currentBuf.duration*1000);
  }
});
setInterval(()=>{
  if(!currentBuf) return;
  if(playing && !seeking){
    const t=curTime();
    $('seekBar').value=Math.round(t/currentBuf.duration*1000);
    $('timeNow').textContent=fmtTime(t);
  }
  $('timeTotal').textContent=fmtTime(currentBuf.duration);
},250);

/* ============ 本地文件 ============ */
function loadFile(file){
  const fr=new FileReader();
  fr.onload=()=>{
    initAudio();
    AC.decodeAudioData(fr.result).then(buf=>{
      bufLabel='本地音频 · '+file.name+' <small>('+buf.duration.toFixed(1)+'s)</small>';
      pauseOffset=0; seeking=false;
      $('timeTotal').textContent=fmtTime(buf.duration);
      playBuffer(buf,bufLabel,0); // 导入即从头播放
    }).catch(()=>alert('无法解码该音频文件'));
  };
  fr.readAsArrayBuffer(file);
}

/* ============ 绘制 ============ */
const cv=$('viz'), ctx=cv.getContext('2d');
const W=cv.width, H=cv.height;
let freqData=new Uint8Array(1024);
let timeData=new Uint8Array(1024);
let simMode=false, simT=0;
const simBands=new Float32Array(96);

/* 频谱数据源：
 * - 播放中且 AudioContext 正常运行 → 真实频谱
 * - 未播放（首次进页面 / 暂停后）→ 全零静默，画布只显示背景与网格线
 * - 播放中但环境无音频设备（headless/静默）→ 平滑噪声模拟，保证可演示 */
function ensureSignal(){
  if(analyser && playing && AC.state==='running'){
    analyser.getByteFrequencyData(freqData);
    analyser.getByteTimeDomainData(timeData);
    simMode=false;
    return true;
  }
  if(!playing){
    // 未播放：清零，不显示任何频谱（修复进页面即乱跳的问题）
    simMode=false;
    freqData.fill(0);
    timeData.fill(128);
    return false;
  }
  // 播放中但取不到数据（无音频设备）：模拟模式兜底
  simMode=true;
  const t=performance.now()/1000;
  for(let i=0;i<96;i++){
    const f=1.2+Math.sin(t*0.9+i*0.35)*0.5;
    simBands[i]=clamp(simBands[i]*0.86 + f*Math.random()*60, 0, 230);
  }
  freqData=new Uint8Array(1024);
  for(let i=0;i<96;i++){
    const v=simBands[i];
    const lo=Math.floor(i/96*1024), hi=Math.floor((i+1)/96*1024);
    for(let j=lo;j<hi;j++) freqData[j]=v;
  }
  for(let i=0;i<1024;i++){
    timeData[i]=128+Math.round(Math.sin(i*0.13+t*9)*34*Math.random());
  }
  return false;
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ensureSignal();
  const nBars=96;
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#9fe8ff'); grad.addColorStop(.5,'#6ec3f0'); grad.addColorStop(1,'#2a6c9e');
  ctx.strokeStyle='rgba(110,195,240,.15)'; ctx.lineWidth=1;
  for(let i=1;i<6;i++){ const y=H*i/6; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  if(mode==='bars'){
    const bw=W/nBars;
    for(let i=0;i<nBars;i++){
      const idx=Math.floor(Math.pow(i/nBars,1.6)*(freqData.length-1));
      const v=freqData[idx]/255;
      const h=v*H*0.92;
      const x=i*bw, y=H-h;
      const g=ctx.createLinearGradient(0,y,0,H);
      g.addColorStop(0,'#dff3ff'); g.addColorStop(.25,'#6ec3f0'); g.addColorStop(1,'rgba(42,108,158,.25)');
      ctx.fillStyle=g;
      ctx.beginPath();
      ctx.moveTo(x+bw/2,y);
      ctx.lineTo(x+bw-2,H);
      ctx.lineTo(x+2,H);
      ctx.closePath();
      ctx.fill();
    }
    // 频谱包络线
    ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1.5; ctx.beginPath();
    for(let i=0;i<nBars;i++){
      const idx=Math.floor(Math.pow(i/nBars,1.6)*(freqData.length-1));
      const y=H-freqData[idx]/255*H*0.92;
      i?ctx.lineTo(i*bw+bw/2,y):ctx.moveTo(i*bw+bw/2,y);
    }
    ctx.stroke();
  }
  else if(mode==='line'){
    ctx.beginPath();
    for(let i=0;i<nBars;i++){
      const idx=Math.floor(Math.pow(i/nBars,1.6)*(freqData.length-1));
      const v=freqData[idx]/255;
      const x=i*(W/nBars), y=H-v*H*0.9;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.strokeStyle='#6ec3f0'; ctx.lineWidth=2.5; ctx.shadowColor='rgba(110,195,240,.8)'; ctx.shadowBlur=12; ctx.stroke();
    ctx.shadowBlur=0;
    ctx.beginPath();
    for(let i=0;i<nBars;i++){
      const idx=Math.floor(Math.pow(i/nBars,1.6)*(freqData.length-1));
      const y=H-freqData[idx]/255*H*0.9;
      ctx.moveTo(i*(W/nBars)+6,y); ctx.arc(i*(W/nBars),y,3,0,7);
    }
    ctx.fillStyle='#dff3ff'; ctx.fill();
  }
  else if(mode==='wave'){
    ctx.lineWidth=2; ctx.strokeStyle='#6ec3f0'; ctx.shadowColor='rgba(110,195,240,.8)'; ctx.shadowBlur=10;
    ctx.beginPath();
    for(let i=0;i<timeData.length;i+=2){
      const v=(timeData[i]-128)/128;
      const x=i/timeData.length*W, y=H/2+v*H*0.4;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.stroke(); ctx.shadowBlur=0;
    // 中轴
    ctx.strokeStyle='rgba(110,195,240,.12)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,H/2); ctx.lineTo(W,H/2); ctx.stroke();
    // 频谱作背景渐变
    ctx.fillStyle='rgba(110,195,240,.06)';
    ctx.fillRect(0,0,W,H);
    for(let i=0;i<nBars;i++){
      const idx=Math.floor(Math.pow(i/nBars,1.6)*(freqData.length-1));
      const v=freqData[idx]/255;
      ctx.fillStyle='rgba(110,195,240,'+(0.02+v*0.12).toFixed(3)+')';
      ctx.fillRect(i*W/nBars,0,W/nBars+1,H);
    }
  }
  else if(mode==='radial'){
    const cx=W/2, cy=H/2, R=Math.min(W,H)/2-30;
    for(let i=0;i<nBars;i++){
      const idx=Math.floor(Math.pow(i/nBars,1.6)*(freqData.length-1));
      const v=freqData[idx]/255;
      const a=i/nBars*Math.PI*2 - Math.PI/2;
      const r0=R*0.55, r1=R*(0.55+v*0.45);
      ctx.strokeStyle='rgba(110,195,240,'+(0.25+v*0.75).toFixed(3)+')';
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a)*r0, cy+Math.sin(a)*r0);
      ctx.lineTo(cx+Math.cos(a)*r1, cy+Math.sin(a)*r1);
      ctx.stroke();
    }
    // 波形环
    ctx.strokeStyle='rgba(223,243,255,.5)'; ctx.lineWidth=1.5;
    ctx.beginPath();
    for(let i=0;i<timeData.length;i+=4){
      const v=(timeData[i]-128)/128;
      const a=i/timeData.length*Math.PI*2;
      const r=R*0.55+v*20;
      const x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.stroke();
    ctx.fillStyle='rgba(110,195,240,.08)';
    ctx.beginPath(); ctx.arc(cx,cy,R*0.55,0,7); ctx.fill();
    ctx.strokeStyle='rgba(110,195,240,.25)';
    ctx.beginPath(); ctx.arc(cx,cy,R*0.55,0,7); ctx.stroke();
  }
  requestAnimationFrame(draw);
}

/* ============ 事件 ============ */
$('btnPlay').onclick=togglePlay;
document.querySelectorAll('[data-mode]').forEach(b=>{
  b.onclick=()=>{ mode=b.dataset.mode; document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x===b)); };
});
document.querySelectorAll('[data-rate]').forEach(b=>{
  b.onclick=()=>{
    rateVal=+b.dataset.rate;
    document.querySelectorAll('[data-rate]').forEach(x=>x.classList.toggle('on',x===b));
    if(source && playing) source.playbackRate.value=rateVal;
  };
});
$('vol').oninput=()=>{ if(master) master.gain.value=$('vol').value/100; };

const dz=$('dropHint');
dz.onclick=()=>{ const i=document.createElement('input'); i.type='file'; i.accept='audio/*'; i.onchange=()=>i.files[0]&&loadFile(i.files[0]); i.click(); };
document.addEventListener('dragover',e=>{e.preventDefault(); dz.style.borderColor='rgba(110,195,240,.8)';});
document.addEventListener('dragleave',()=>{dz.style.borderColor='';});
document.addEventListener('drop',e=>{
  e.preventDefault(); dz.style.borderColor='';
  const f=e.dataTransfer.files[0];
  if(f && f.type.startsWith('audio/')) loadFile(f);
});

/* ============ 导出（透明 PNG 序列 / 黑底视频带原曲音轨） ============ */
function getExportParams(){
  return {
    mode: $('expMode').value,
    w: clamp(parseInt($('expW').value,10)||960,160,1920),
    h: clamp(parseInt($('expH').value,10)||540,90,1080),
    fps: parseInt($('expFps').value,10)||24,
  };
}

/* 逐帧离线渲染采样整曲频谱：对每一帧时间点 t 渲染 [t, t+1/fps+0.12s) 的音频段，
 * 取 analyser 末尾数据作为该帧频谱。导出时长 = 整曲时长（不受播放状态影响）。
 * 实测：headless 下约 3ms/帧，3 分钟歌曲 24fps 采样约 13 秒。 */
async function sampleFrames(buf,fps,onProgress){
  const sr=buf.sampleRate;
  const dur=buf.duration;
  const total=Math.max(1,Math.ceil(dur*fps));
  const segDur=1/fps+0.12;
  const segSamples=Math.ceil(segDur*sr);
  const freqFrames=[], timeFrames=[];
  for(let i=0;i<total;i++){
    const t=i/fps;
    const off=new OfflineAudioContext(1,segSamples,sr);
    const src=off.createBufferSource();
    src.buffer=buf; src.loop=false;
    const an=off.createAnalyser();
    an.fftSize=2048; an.smoothingTimeConstant=0.5;
    src.connect(an); an.connect(off.destination);
    src.start(0,t,segDur);
    await off.startRendering();
    const f=new Uint8Array(an.frequencyBinCount);
    const tm=new Uint8Array(an.fftSize);
    an.getByteFrequencyData(f);
    an.getByteTimeDomainData(tm);
    freqFrames.push(f); timeFrames.push(tm);
    if(onProgress) onProgress(i+1,total);
  }
  return {freqFrames,timeFrames,total,dur};
}

/* 导出画布（透明底或黑底），四种模式，任意尺寸 */
let expCanvas=null, expCtx=null;
function paintExport(mode,freq,time,opts){
  const {w,h,bg}=opts;
  if(!expCanvas){
    expCanvas=document.createElement('canvas');
    expCtx=expCanvas.getContext('2d',{willReadFrequently:true});
  }
  expCanvas.width=w; expCanvas.height=h;
  const ctx=expCtx;
  ctx.clearRect(0,0,w,h);
  if(bg==='black'){ ctx.fillStyle='#06101e'; ctx.fillRect(0,0,w,h); }
  const nBars=96;
  // 网格线（透明底上也保留，营造科技感）
  ctx.strokeStyle='rgba(110,195,240,.15)'; ctx.lineWidth=1;
  for(let i=1;i<6;i++){ const y=h*i/6; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
  const idxOf=i=>Math.floor(Math.pow(i/nBars,1.6)*(freq.length-1));
  if(mode==='bars'){
    const bw=w/nBars;
    for(let i=0;i<nBars;i++){
      const v=freq[idxOf(i)]/255;
      const hh=v*h*0.92;
      const x=i*bw, y=h-hh;
      const g=ctx.createLinearGradient(0,y,0,h);
      g.addColorStop(0,'#dff3ff'); g.addColorStop(.25,'#6ec3f0'); g.addColorStop(1,'rgba(42,108,158,.25)');
      ctx.fillStyle=g;
      ctx.beginPath();
      ctx.moveTo(x+bw/2,y);
      ctx.lineTo(x+bw-2,h);
      ctx.lineTo(x+2,h);
      ctx.closePath();
      ctx.fill();
    }
    ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1.5; ctx.beginPath();
    for(let i=0;i<nBars;i++){
      const y=h-freq[idxOf(i)]/255*h*0.92;
      i?ctx.lineTo(i*bw+bw/2,y):ctx.moveTo(i*bw+bw/2,y);
    }
    ctx.stroke();
  } else if(mode==='line'){
    ctx.beginPath();
    for(let i=0;i<nBars;i++){
      const v=freq[idxOf(i)]/255;
      const x=i*(w/nBars), y=h-v*h*0.9;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.strokeStyle='#6ec3f0'; ctx.lineWidth=2.5; ctx.shadowColor='rgba(110,195,240,.8)'; ctx.shadowBlur=12; ctx.stroke();
    ctx.shadowBlur=0;
    ctx.beginPath();
    for(let i=0;i<nBars;i++){
      const y=h-freq[idxOf(i)]/255*h*0.9;
      ctx.moveTo(i*(w/nBars)+6,y); ctx.arc(i*(w/nBars),y,3,0,7);
    }
    ctx.fillStyle='#dff3ff'; ctx.fill();
  } else if(mode==='wave'){
    ctx.lineWidth=2; ctx.strokeStyle='#6ec3f0'; ctx.shadowColor='rgba(110,195,240,.8)'; ctx.shadowBlur=10;
    ctx.beginPath();
    for(let i=0;i<time.length;i+=2){
      const v=(time[i]-128)/128;
      const x=i/time.length*w, y=h/2+v*h*0.4;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.stroke(); ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(110,195,240,.12)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(0,h/2); ctx.lineTo(w,h/2); ctx.stroke();
    for(let i=0;i<nBars;i++){
      const v=freq[idxOf(i)]/255;
      ctx.fillStyle='rgba(110,195,240,'+(0.02+v*0.12).toFixed(3)+')';
      ctx.fillRect(i*w/nBars,0,w/nBars+1,h);
    }
  } else if(mode==='radial'){
    const cx=w/2, cy=h/2, R=Math.min(w,h)/2-30;
    for(let i=0;i<nBars;i++){
      const v=freq[idxOf(i)]/255;
      const a=i/nBars*Math.PI*2 - Math.PI/2;
      const r0=R*0.55, r1=R*(0.55+v*0.45);
      ctx.strokeStyle='rgba(110,195,240,'+(0.25+v*0.75).toFixed(3)+')';
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a)*r0, cy+Math.sin(a)*r0);
      ctx.lineTo(cx+Math.cos(a)*r1, cy+Math.sin(a)*r1);
      ctx.stroke();
    }
    ctx.strokeStyle='rgba(223,243,255,.5)'; ctx.lineWidth=1.5;
    ctx.beginPath();
    for(let i=0;i<time.length;i+=4){
      const v=(time[i]-128)/128;
      const a=i/time.length*Math.PI*2;
      const r=R*0.55+v*20;
      const x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.stroke();
    ctx.fillStyle='rgba(110,195,240,.08)';
    ctx.beginPath(); ctx.arc(cx,cy,R*0.55,0,7); ctx.fill();
    ctx.strokeStyle='rgba(110,195,240,.25)';
    ctx.beginPath(); ctx.arc(cx,cy,R*0.55,0,7); ctx.stroke();
  }
}

/* ZIP（store 方法，PNG 已压缩无需 deflate） */
const CRC_TABLE=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c;}return t;})();
function crc32(buf){let c=0xFFFFFFFF;for(let i=0;i<buf.length;i++)c=CRC_TABLE[(c^buf[i])&0xFF]^(c>>>8);return(c^0xFFFFFFFF)>>>0;}
function buildZip(files){
  const enc=new TextEncoder();
  const parts=[], central=[];
  let offset=0;
  for(const f of files){
    const nb=enc.encode(f.name);
    const crc=crc32(f.data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true);
    lh.setUint16(8,0,true); lh.setUint16(10,0,true); lh.setUint16(12,0,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,f.data.length,true); lh.setUint32(22,f.data.length,true);
    lh.setUint16(26,nb.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),nb,f.data);
    central.push({nb,crc,size:f.data.length,offset});
    offset+=30+nb.length+f.data.length;
  }
  const cdStart=offset;
  for(const c of central){
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true);
    ch.setUint16(8,0,true); ch.setUint16(10,0,true); ch.setUint16(12,0,true); ch.setUint16(14,0,true);
    ch.setUint32(16,c.crc,true); ch.setUint32(20,c.size,true); ch.setUint32(24,c.size,true);
    ch.setUint16(28,c.nb.length,true);
    ch.setUint32(42,c.offset,true);
    parts.push(new Uint8Array(ch.buffer),c.nb);
    offset+=46+c.nb.length;
  }
  const cdSize=offset-cdStart;
  const eocd=new DataView(new ArrayBuffer(22));
  eocd.setUint32(0,0x06054b50,true); eocd.setUint16(8,files.length,true); eocd.setUint16(10,files.length,true);
  eocd.setUint32(12,cdSize,true); eocd.setUint32(16,cdStart,true);
  parts.push(new Uint8Array(eocd.buffer));
  const total=parts.reduce((a,p)=>a+p.length,0);
  const out=new Uint8Array(total);
  let o=0; for(const p of parts){ out.set(p,o); o+=p.length; }
  return out;
}

function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },3000);
}

async function exportPngSeq(){
  const p=getExportParams();
  if(!currentBuf){ $('expProgress').textContent='请先导入音频'; return; }
  const buf=currentBuf;
  const prog=$('expProgress');
  const total=Math.max(1,Math.ceil(buf.duration*p.fps));
  prog.textContent='采样频谱中… 0/'+total;
  const {freqFrames,timeFrames,total:t2}=await sampleFrames(buf,p.fps,(i,n)=>{
    prog.textContent='采样频谱中… '+i+'/'+n;
  });
  const files=[];
  for(let i=0;i<t2;i++){
    paintExport(p.mode,freqFrames[i],timeFrames[i],{w:p.w,h:p.h,bg:'transparent'});
    const blob=await new Promise(res=>expCanvas.toBlob(res,'image/png'));
    const data=new Uint8Array(await blob.arrayBuffer());
    files.push({name:'frame'+String(i+1).padStart(4,'0')+'.png',data});
    if(i%10===0) prog.textContent='渲染 PNG 帧… '+i+'/'+t2;
  }
  const zip=buildZip(files);
  downloadBlob(new Blob([zip],{type:'application/zip'}),
    'spectrum-'+p.mode+'-'+p.w+'x'+p.h+'-'+t2+'f.zip');
  prog.textContent='已导出 '+t2+' 帧 PNG 序列（'+Math.round(zip.length/1024)+' KB）';
}

async function exportVideo(){
  const p=getExportParams();
  if(!currentBuf){ $('expProgress').textContent='请先导入音频'; return; }
  const buf=currentBuf;
  const prog=$('expProgress');
  const total=Math.max(1,Math.ceil(buf.duration*p.fps));
  prog.textContent='采样频谱中… 0/'+total;
  const {freqFrames,timeFrames,total:t2,dur}=await sampleFrames(buf,p.fps,(i,n)=>{
    prog.textContent='采样频谱中… '+i+'/'+n;
  });
  // 复用导出画布：paintExport 画的就是它，captureStream 也必须录它
  if(!expCanvas){ expCanvas=document.createElement('canvas'); expCtx=expCanvas.getContext('2d',{willReadFrequently:true}); }
  expCanvas.width=p.w; expCanvas.height=p.h;
  const canvasStream=expCanvas.captureStream(p.fps);
  // 音频轨：独立 source 静音输出到 MediaStreamDestination（不打扰正在播放的播放器）
  initAudio();
  const mDest=AC.createMediaStreamDestination();
  const aSrc=AC.createBufferSource();
  aSrc.buffer=buf;
  aSrc.connect(mDest);
  const stream=new MediaStream([...canvasStream.getVideoTracks(), ...mDest.stream.getAudioTracks()]);
  const mime=MediaRecorder.isTypeSupported('video/mp4;codecs=avc1.42E01E,mp4a.40.2')
    ?'video/mp4;codecs=avc1.42E01E,mp4a.40.2' // 显式声明音频编码器 → AAC（mp4+opus 兼容性差）
    :(MediaRecorder.isTypeSupported('video/mp4;codecs=avc1.42E01E')?'video/mp4;codecs=avc1.42E01E'
      :(MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')?'video/webm;codecs=vp9,opus':'video/webm'));
  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:6_000_000,audioBitsPerSecond:192_000});
  const chunks=[];
  rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  const done=new Promise(res=>rec.onstop=res);
  rec.start(200);
  AC.resume();
  aSrc.start(0,0); // 音频从 0 开始，与视频帧同步（performance.now 时钟，漂移 < 10ms/3min）
  const t0=performance.now();
  let fi=0;
  await new Promise(res=>{
    const iv=setInterval(()=>{
      const t=performance.now()-t0;
      fi=Math.min(t2-1,Math.floor(t/1000*p.fps));
      paintExport(p.mode,freqFrames[fi],timeFrames[fi],{w:p.w,h:p.h,bg:'black'});
      prog.textContent='录制视频… '+fi+'/'+t2+'（'+Math.round(t/10)/100+'s）';
      if(t>=dur*1000+50 || fi>=t2-1 && t>=dur*1000-20){
        clearInterval(iv);
        try{ aSrc.stop(); }catch(e){}
        rec.stop(); res();
      }
    },Math.max(16,1000/p.fps/2));
  });
  await done;
  await new Promise(r=>setTimeout(r,300)); // 确保最后一个 dataavailable 已送达
  stream.getTracks().forEach(t=>t.stop());
  const blob=new Blob(chunks,{type:mime.split(';')[0]});
  const ext=mime.startsWith('video/mp4')?'mp4':'webm';
  const name='spectrum-'+p.mode+'-'+p.w+'x'+p.h+'.'+ext;
  downloadBlob(blob,name);
  prog.textContent='已导出 '+name+'（'+Math.round(blob.size/1024)+' KB，含原曲音轨）';
}

$('btnExpPng').onclick=()=>{
  const prog=$('expProgress');
  prog.textContent='准备导出…';
  exportPngSeq().catch(e=>{ prog.textContent='导出失败：'+e.message; console.error(e); });
};
$('btnExpVid').onclick=()=>{
  const prog=$('expProgress');
  prog.textContent='准备导出…';
  exportVideo().catch(e=>{ prog.textContent='导出失败：'+e.message; console.error(e); });
};

draw();
